[project]
name = "icaic-practice-hub"
version = "0.1.0"
description = "Shared practice workspaces and evaluation for the three-task pilot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18",
  "httpx>=0.28,<1",
  "websockets>=14,<17",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "jupyterlab>=4.2,<5",
  "creepy-catacombs-s1==0.1.4",
  "matplotlib>=3.8,<4",
  "nbformat>=5.10,<6",
  "markdown>=3.7,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isolation: requires the laptop's Bubblewrap process isolation"]
