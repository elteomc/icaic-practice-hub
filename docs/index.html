<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183c37">
  <title>ICAIC Practice Room</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=english-1">
  <script src="hard.js?v=lists-1" defer></script>
  <script src="library.js?v=english-1" defer></script>
  <script src="free.js?v=catalog-1" defer></script>
  <style>
    .profile-picker{background:transparent;color:inherit;border:1px solid #ffffff40;padding:9px;width:100%}
    .profile-picker option{color:#20372f}.task-grid{margin-bottom:32px}
    .prose pre{overflow:auto;padding:18px;background:#f0f2e9;line-height:1.6}.prose table{border-collapse:collapse}.prose th,.prose td{border:1px solid var(--line);padding:9px}.prose a{overflow-wrap:anywhere}
    .free-actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.free-actions a{text-decoration:none}.local-note{min-height:100px}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:14px}.board-row{padding:18px;border-bottom:1px solid var(--line)}.board-row:last-child{border:0}.status-line{margin:10px 0 0;font-size:13px;color:var(--muted)}.prose img{max-width:100%}input[type=file]{max-width:100%}
    @media(max-width:800px){.result-grid{grid-template-columns:1fr}.free-actions .btn{width:100%}}
  </style>
</head>
<body>
  <div id="app"><main class="initial"><div class="brandmark">P</div><p>Opening the practice room...</p></main></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
